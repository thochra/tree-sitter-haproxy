# HAProxy Syntax Highlighting Test File
# ==============================================================================
# This file contains a mix of configuration sections, value types, and logic
# to verify syntax highlighting accuracy.

global
    # Process management and security
    daemon
    master-worker
    maxconn 10000
    user haproxy
    group haproxy
    chroot /var/lib/haproxy
    pidfile /var/run/haproxy.pid
    hard-stop-after 5m

    # Logging
    log /dev/log local0
    log /dev/log local1 notice
    log 127.0.0.1:514 local2 warning

    # SSL / TLS Tuning
    ssl-default-bind-ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384
    ssl-default-bind-ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256
    ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets
    ssl-dh-param-file /etc/haproxy/dhparam.pem
    tune.ssl.default-dh-param 2048
    tune.bufsize 32768
    tune.lua.burst-timeout 1000ms

    # Threading and CPU
    nbthread 4
    cpu-map auto:1/1-4 0-3

    # Runtime API
    stats socket /var/run/haproxy.sock mode 660 level admin expose-fd listeners
    stats timeout 2m

    # Lua Integration
    lua-load /etc/haproxy/lua/auth-request.lua
    set-var proc.started int(date())

    # Environment variable usage
    presetenv HAPROXY_ENV production

# ------------------------------------------------------------------------------
# PEERS: Synchronization between nodes
# ------------------------------------------------------------------------------
peers mypeers
    bind 10.0.0.1:1024 ssl crt /etc/haproxy/peers.pem
    peer node1 10.0.0.1:1024
    peer node2 10.0.0.2:1024
    default-bind abns@haproxy-peers

# ------------------------------------------------------------------------------
# MAIL: Email alerting configuration
# ------------------------------------------------------------------------------
mailers mymailers
    timeout mail 10s
    mailer smtp1 192.168.0.1:25
    mailer smtp2 192.168.0.2:587

# ------------------------------------------------------------------------------
# RESOLVERS: DNS configuration
# ------------------------------------------------------------------------------
resolvers mydns
    nameserver dns1 1.1.1.1:53
    nameserver dns2 8.8.8.8:53
    resolve_retries 3
    timeout retry   1s
    hold valid      10s
    hold other      30s
    hold refused    30s
    hold nx         30s
    hold timeout    30s
    accepted_payload_size 8192

# ------------------------------------------------------------------------------
# USERLIST: Internal Authentication
# ------------------------------------------------------------------------------
userlist admins
    group superusers
    user admin insecure-password mypassword groups superusers
    user viewer insecure-password viewonly

# ------------------------------------------------------------------------------
# FCGI: FastCGI Application Definition
# ------------------------------------------------------------------------------
fcgi-app php-fpm
    log-stderr global
    option keep-conn
    docroot /var/www/html
    index index.php
    path-info ^(/.+\.php)(/.*)?$

# ------------------------------------------------------------------------------
# PROGRAM: External Process Management (HAProxy 2.x+)
# ------------------------------------------------------------------------------
program api-sidecar
    command /usr/bin/python3 /opt/api/main.py --port 9000
    user haproxy
    group haproxy
    option start-on-reload

# ------------------------------------------------------------------------------
# DEFAULTS
# ------------------------------------------------------------------------------
defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    option  redispatch
    option  log-health-checks

    # Timeouts
    timeout connect 5000ms
    timeout client  50000
    timeout server  50000
    timeout tunnel  1h
    timeout http-request 10s
    timeout http-keep-alive 60s

    # Error Files
    errorfile 400 /etc/haproxy/errors/400.http
    errorfile 503 /etc/haproxy/errors/503.http

# ------------------------------------------------------------------------------
# FRONTEND: HTTP Ingress
# ------------------------------------------------------------------------------
frontend fe_web
    # Bindings: IPv4, IPv6, Unix Sockets, SSL, Proxy Protocol
    bind :80
    bind :443 ssl crt /etc/haproxy/certs/ alpn h2,http/1.1
    bind ipv6@:80
    bind /var/run/haproxy-web.sock mode 666 level user
    bind 127.0.0.1:8443 accept-proxy

    # Settings
    maxconn 5000
    option forwardfor except 127.0.0.0/8
    option http-buffer-request

    # Captures
    capture request header Host len 32
    capture response header Content-Length len 10

    # Access Control Lists (ACLs)
    acl is_static       path_end -i .jpg .gif .png .css .js
    acl is_api          path_beg /api/
    acl is_admin_net    src 10.0.0.0/8 192.168.1.0/24
    acl invalid_method  method OPTIONS DELETE TRACE
    acl site_dead       nbsrv(be_app) lt 1
    acl auth_ok         http_auth(admins)

    # Complex ACLs with Macros
    acl secure_cookie   res.cook(JSESSIONID),debug -m found

    # Variable setting
    http-request set-var(req.my_ip) src
    http-request set-var(txn.path_len) path,length

    # HTTP Request Rules
    http-request deny if invalid_method
    http-request redirect scheme https code 301 if !{ ssl_fc }
    http-request auth realm "Restricted" unless auth_ok is_admin_net
    http-request set-header X-Forwarded-Proto https if { ssl_fc }
    http-request set-query %[query,regsub(%3D,=,g)]
    http-request return status 200 content-type "text/plain" string "Healthy" if { path /health }

    # Lua execution
    http-request lua.auth-check if is_api

    # Backend Switching
    use_backend be_static if is_static
    use_backend be_api    if is_api
    default_backend be_app

# ------------------------------------------------------------------------------
# FRONTEND: TCP Ingress (SNI Routing)
# ------------------------------------------------------------------------------
frontend fe_tcp_routing
    mode tcp
    bind *:443
    option tcplog

    tcp-request inspect-delay 5s
    tcp-request content accept if { req_ssl_hello_type 1 }

    acl app_a req_ssl_sni -i app-a.example.com
    acl app_b req_ssl_sni -i app-b.example.com

    use_backend be_tcp_app_a if app_a
    use_backend be_tcp_app_b if app_b

# ------------------------------------------------------------------------------
# BACKEND: Main Application
# ------------------------------------------------------------------------------
backend be_app
    mode http
    balance roundrobin
    cookie SERVERID insert indirect nocache

    # Options
    option httpchk GET /health HTTP/1.1\r\nHost:\ www.example.com
    http-check expect status 200

    # Headers
    http-response set-header X-Server %s
    http-response del-header Server
    http-response add-header Strict-Transport-Security "max-age=31536000"

    # Servers with various parameters
    server app1 10.0.1.10:8080 check cookie s1 maxconn 100 weight 10
    server app2 10.0.1.11:8080 check cookie s2 maxconn 100 weight 10 slowstart 60s
    server app3 10.0.1.12:8080 check cookie s3 backup
    server app4 ${ENV_HOST_IP}:8080 check inter 2000 rise 2 fall 3

    # Stick Table (Rate Limiting)
    stick-table type ip size 1m expire 10s store http_req_rate(10s)
    http-request track-sc0 src
    http-request deny deny_status 429 if { sc_http_req_rate(0) gt 100 }

# ------------------------------------------------------------------------------
# BACKEND: Static Assets
# ------------------------------------------------------------------------------
backend be_static
    mode http
    balance leastconn
    option http-keep-alive

    # Resolver usage
    server static-cdn cdn.example.com:80 check resolvers mydns resolve-prefer ipv4

# ------------------------------------------------------------------------------
# BACKEND: API (FCGI)
# ------------------------------------------------------------------------------
backend be_api
    mode http
    use-fcgi-app php-fpm
    server php01 127.0.0.1:9000 proto fcgi

# ------------------------------------------------------------------------------
# LISTEN: Admin Statistics
# ------------------------------------------------------------------------------
listen stats
    bind :8404
    mode http
    stats enable
    stats hide-version
    stats realm Haproxy\ Statistics
    stats uri /haproxy?stats
    stats auth admin:secret
    stats refresh 10s
    stats show-node
    stats show-legends
    stats show-desc "Main Load Balancer"

# ------------------------------------------------------------------------------
# RING: Log buffer (Newer feature)
# ------------------------------------------------------------------------------
ring myring
    description "Local buffer for events"
    format rfc5424
    maxlen 1200
    size 32768
    timeout connect 5s
    server local_syslog 127.0.0.1:514 log-proto octet-count
